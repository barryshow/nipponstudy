name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ARKS_API_KEY: ${{ secrets.ARKS_API_KEY }}
          ARKS_BASE_URL: ${{ secrets.ARKS_BASE_URL }}

      - name: Deploy to VPS via rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avz --delete --exclude='node_modules' --exclude='.git' --exclude='.env*' --exclude='.next'"
          SOURCE: "."
          REMOTE_HOST: "134.195.211.142"
          REMOTE_USER: "deployer"
          TARGET: "/home/deployer/apps/nipponstudy"

      - name: Remote build and restart
        uses: appleboy/ssh-action@v1
        with:
          host: "134.195.211.142"
          username: "deployer"
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deployer/apps/nipponstudy
            npm ci --production=false
            npx prisma generate
            npm run build
            pm2 restart ecosystem.config.js --env production