upstream nextjs_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name barryshow.net www.barryshow.net;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务器块
server {
    listen 443 ssl http2;
    server_name barryshow.net www.barryshow.net;

    # SSL 证书路径（certbot 会自动填入）
    ssl_certificate     /etc/letsencrypt/live/barryshow.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barryshow.net/privkey.pem;

    # SSL 配置（现代 + 兼容性）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS（确保 HTTPS 强制的首选方式）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隐藏 Nginx 版本（防扫描）
    server_tokens off;

    # 日志
    access_log /var/log/nginx/nipponstudy-access.log;
    error_log  /var/log/nginx/nipponstudy-error.log;

    # ========== 静态资源缓存 ==========

    # _next/static — 哈希文件名，永久缓存（浏览器 + CDN）
    location /_next/static {
        alias /home/deployer/apps/nipponstudy/.next/static;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/static — 自定义静态文件
    location /static {
        alias /home/deployer/apps/nipponstudy/public/static;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/images — 图片
    location /images {
        alias /home/deployer/apps/nipponstudy/public/images;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # favicon
    location = /favicon.ico {
        root /home/deployer/apps/nipponstudy/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /robots.txt {
        root /home/deployer/apps/nipponstudy/public;
        access_log off;
    }

    # ========== 动态请求 → Next.js ==========
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（AI API 可能较慢）
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Cloudflare 回源 IP 识别（获取真实访客 IP）
        include /etc/nginx/cloudflare-ips.conf;
        real_ip_header CF-Connecting-IP;
    }

    # ========== API 路由（不缓存） ==========
    location /api/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API 永远不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 限制请求体大小
    client_max_body_size 10m;
}